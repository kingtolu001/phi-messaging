worker_processes auto;
worker_rlimit_nofile 65536;
events { worker_connections 32768; }
http {
  access_log off;
  error_log stderr warn;
  upstream apps {
    server app1:8080;
    server app2:8080;
    server app3:8080;
    keepalive 128;
  }
  map $http_upgrade $connection_upgrade { default upgrade; '' ''; }
  server {
    listen 80;
    client_max_body_size 32k;
    error_page 413 = @too_large;
    error_page 502 503 504 = @unavailable;
    location @too_large {
      default_type application/json;
      return 413 '{"code":"too_large","message":"Request body is too large"}';
    }
    location @unavailable {
      default_type application/json;
      return 503 '{"code":"unavailable","message":"Service temporarily unavailable"}';
    }
    location / {
      proxy_pass http://apps;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 60s;
      proxy_connect_timeout 1s;
      proxy_send_timeout 10s;
      proxy_buffering off;
      proxy_next_upstream off;
    }
  }
}
